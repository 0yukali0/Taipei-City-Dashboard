name: Python linting

on:
  pull_request:
    branches: ["main"]

jobs:
  python-lint:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.8"
      - name: Install ruff formatter
        run: uv tool install ruff
      - name: Format
        run: ruff format .
        working-directory: Taipei-City-Dashboard-DE